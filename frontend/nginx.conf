server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS resolver needed for proxy_pass to HTTPS hostnames.
    resolver 1.1.1.1 1.0.0.1 valid=300s ipv6=off;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;

    # SPA routing — fall back to index.html for all non-file requests
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to backend Container App.
    location /api/ {
        proxy_pass https://ca-holidays-backend.nicegrass-38567ece.northeurope.azurecontainerapps.io/api/;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host ca-holidays-backend.nicegrass-38567ece.northeurope.azurecontainerapps.io;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
